{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white"><b>Cadastrar Nova Secretaria / Gestor</b></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome da Secretaria:</label>
                        <input type="text" name="nome" class="form-control" placeholder="Ex: Secretaria Municipal de Agricultura" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome do Secretário(a) / Responsável:</label>
                        <input type="text" name="secretario" class="form-control" placeholder="Ex: João da Silva" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Registar Secretaria</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white"><b>Secretarias Cadastradas e Responsáveis</b></div>
            <div class="card-body">
                <table class="table table-striped table-bordered text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Secretaria</th>
                            <th>Secretário(a) Atual</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in secretarias %}
                        <tr>
                            <td class="text-start"><b>{{ s.nome }}</b></td>
                            <td>{{ s.secretario }}</td>
                            <td>
                                <a href="/secretarias/editar/{{ s.id }}" class="btn btn-sm btn-warning">Editar</a>
                                <a href="/secretarias/excluir/{{ s.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja remover esta secretaria?')">Excluir</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="mt-3">
    <a href="/" class="btn btn-secondary">⬅ Voltar ao Painel Principal</a>
</div>
{% endblock %}

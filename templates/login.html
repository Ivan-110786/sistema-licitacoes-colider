<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Licitações Colíder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white; border-radius: 8px; }
        .header-prefeitura { background-color: #0f2240; color: white; padding: 15px; border-radius: 6px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header-prefeitura">
            <h4>COLÍDER - MT</h4>
            <small>Acesso ao Sistema de Licitações</small>
        </div>
        {% if erro %}
        <div class="alert alert-danger py-2 text-center">{{ erro }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Utilizador:</label>
                <input type="text" name="username" class="form-control" placeholder="Ex: julia ou admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha:</label>
                <input type="password" name="senha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Entrar no Sistema</button>
        </form>

        <!-- Opção de Recuperação de Senha por E-mail -->
        <div class="text-center mt-2">
            <a href="/recuperar-senha" class="text-decoration-none small text-secondary">Esqueceu a sua senha? Clique aqui</a>
        </div>

        <div class="mt-3 text-center text-muted border-top pt-2">
            <small>Dica de Teste: <b>admin</b> (senha: 123) ou <b>julia</b> (senha: 123)</small>
        </div>
    </div>
</body>
</html>

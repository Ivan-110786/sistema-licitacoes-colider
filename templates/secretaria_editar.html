{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark"><b>Editar Secretaria / Gestor</b></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome da Secretaria:</label>
                        <input type="text" name="nome" class="form-control" value="{{ secretaria.nome }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome do Secretário(a) / Responsável Atual:</label>
                        <input type="text" name="secretario" class="form-control" value="{{ secretaria.secretario }}" required>
                        <small class="text-muted">Nota: Alterar o secretário aqui atualizará os novos documentos, mas os relatórios antigos preservam o histórico de quem estava no cargo na altura do registo.</small>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Guardar Alterações</button>
                </form>
            </div>
        </div>
        <div class="mt-3">
            <a href="/secretarias" class="btn btn-secondary">⬅ Voltar à Gestão de Secretarias</a>
        </div>
    </div>
</div>
{% endblock %}
